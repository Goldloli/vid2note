[project]
name = "vid2note-workspace"
version = "0.1.0"
description = "vid2note monorepo"
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["core", "server"]

[tool.uv.sources]
vid2note-core = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "slow: 耗时长的测试",
    "network: 需要网络",
    "golden: Golden dataset",
    "gpu: 需要 GPU"
]
addopts = "-ra --strict-markers"
testpaths = ["core/tests", "server/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# errors.py 的领域异常类采用 DownloadXxx/ASRXxx 命名约定（领域可读性优先于 Error 后缀）
"core/src/vid2note_core/errors.py" = ["N818"]
# types.py 的枚举有意继承 (str, Enum) 以保证 JSON 序列化兼容
"core/src/vid2note_core/types.py" = ["UP042"]
[tool.mypy]
python_version = "3.11"
# 渐进式类型检查：不强制 strict（既有代码大量未注解），
# 保留真正的类型错误检测，逐步收紧。
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
warn_return_any = false
warn_unused_ignores = true
[[tool.mypy.overrides]]
module = ["funasr.*", "torch.*", "modelscope.*", "respx.*", "yaml.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["vid2note_core", "vid2note_server"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
# 实际覆盖率 ~77%（LLM 适配器需 API Key 才能测真实调用）。
# 设 75% 为 CI 门限，保证核心逻辑覆盖同时不阻塞无密钥环境。
fail_under = 75
show_missing = true

[dependency-groups]
dev = [
    "pyinstaller==6.16.0",
]
