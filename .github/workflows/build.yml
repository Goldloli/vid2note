name: Build Desktop

on:
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install Python dependencies
        run: uv pip install --system -e "./core[local-asr,dev]" -e "./server[dev]"
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Fetch binaries
        run: python scripts/fetch_binaries.py
      - name: Build Python backend
        run: python scripts/build.py
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json
      - name: Install frontend dependencies
        run: cd desktop && npm ci
      - name: Build Electron app
        run: cd desktop && npm run electron:build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vid2note-macos-arm64
          path: desktop/dist-electron/*.dmg

  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push CPU image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.cpu
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/vid2note:latest
            ${{ secrets.DOCKER_USERNAME }}/vid2note:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push GPU image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.gpu
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/vid2note:gpu-latest
            ${{ secrets.DOCKER_USERNAME }}/vid2note:gpu-${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
