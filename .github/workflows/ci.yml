name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Release safety preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository and history
        run: python scripts/release_preflight.py

  backend:
    name: Backend tests and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: backend
        run: python -m pytest -q

      - name: Audit runtime dependencies
        working-directory: backend
        run: python -m pip_audit -r requirements.txt

  frontend:
    name: Frontend lint, build, and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Test, lint, and build
        working-directory: frontend
        run: npm run check

      - name: Audit dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  container:
    name: Container build
    runs-on: ubuntu-latest
    needs: [preflight, backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: vid2note:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
