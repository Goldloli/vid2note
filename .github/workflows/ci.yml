name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: |
          uv pip install --system -e "./core[dev]" -e "./server[dev]"
          uv pip install --system types-pyyaml
      - name: Run tests with coverage
        run: pytest core/tests/ server/tests/ -v --cov=vid2note_core --cov=vid2note_server --cov-report=xml --cov-fail-under=75
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: |
          uv pip install --system -e "./core[dev]" -e "./server[dev]"
          uv pip install --system types-pyyaml
      - name: Ruff check
        run: ruff check core/src server/src
      - name: Ruff format check
        run: ruff format --check core/src server/src
      - name: MyPy type check
        run: mypy core/src server/src

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies
        run: cd desktop && npm ci
      - name: Build frontend
        run: cd desktop && npm run build
