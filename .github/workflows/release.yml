name: Release

# 仅在打 v* tag 时触发：构建 macOS arm64 + Docker，发布 GitHub Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ── 构建 macOS arm64 .dmg ──────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install Python dependencies
        run: uv pip install --system -e "./core[local-asr,dev]" -e "./server[dev]"
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Fetch binaries
        run: python scripts/fetch_binaries.py
      - name: Build Python backend
        run: python scripts/build.py
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json
      - name: Install frontend dependencies
        run: cd desktop && npm ci
      - name: Build Electron app
        run: cd desktop && npm run electron:build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vid2note-macos-arm64
          path: desktop/dist-electron/*.dmg

  # ── 构建 Docker CPU/GPU 镜像 ──────────────────────
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push CPU image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.cpu
          push: ${{ secrets.DOCKER_USERNAME != '' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/vid2note:latest
            ${{ secrets.DOCKER_USERNAME }}/vid2note:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 发布 Release ──────────────────────────────────
  release:
    runs-on: ubuntu-latest
    needs: [build-macos]
    steps:
      - uses: actions/checkout@v4
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: vid2note-macos-arm64
          path: dist/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
