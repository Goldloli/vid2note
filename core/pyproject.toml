[project]
name = "vid2note-core"
version = "0.1.0"
description = "vid2note 核心业务库（无 FastAPI 依赖）"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.1,<3",
    "pyyaml>=6.0,<7",
    "openai>=1.10,<2",
    "httpx>=0.26,<1",
    "requests>=2.31,<3",
    "pymupdf>=1.23,<2",
    "pillow>=10.2,<11",
    "aiofiles>=23.2,<24",
    "slowapi>=0.1.9,<1",
]

[project.optional-dependencies]
local-asr = [
    "torch>=2.1,<3",
    "torchaudio>=2.1,<3",
    "funasr>=1.0,<2",
    "modelscope>=1.10,<2",
]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=4.1,<6",
    "pytest-watch>=4.2,<5",
    "respx>=0.20,<1",
    "freezegun>=1.4,<2",
    "ruff>=0.5,<1",
    "mypy>=1.8,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vid2note_core"]
